[package]
name = "rapl-bridge"
version = "0.3.0"
edition = "2021"
description = "Minimal audited user-mode bridge to the RaplPkg kernel driver"
license = "MIT"
publish = false

[dependencies]
rapl-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry"] }