name: Rust tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Bridge tests
        run: cargo test --manifest-path bridge/Cargo.toml
      - name: Bridge Windows build
        run: cargo build --manifest-path bridge/Cargo.toml --release --target x86_64-pc-windows-msvc
      - name: Bridge tests
        run: cargo test --manifest-path bridge/Cargo.toml
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
