name: Rust tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CLI
        run: cargo test --all-targets
      - name: Lint CLI
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build CLI
        run: cargo build --release
      - name: Test bridge parser
        run: cargo test --manifest-path bridge/Cargo.toml
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test CLI
        run: cargo test --all-targets
      - name: Release build CLI
        run: cargo build --release
      - name: Test bridge
        run: cargo test --manifest-path bridge/Cargo.toml
      - name: Release build bridge
        run: cargo build --manifest-path bridge/Cargo.toml --release --target x86_64-pc-windows-msvc
