[package]
name = "win-mmio-msr-cli"
version = "0.2.0"
edition = "2021"
description = "Windows Intel RAPL package power limit CLI with a fail-closed hardware bridge"
license = "MIT"
publish = false

[lib]
name = "win_mmio_msr_cli"
path = "src/lib.rs"

[[bin]]
name = "win-mmio-msr-cli"
path = "src/main.rs"

[workspace]
members = ["core", "bridge", "service"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rapl-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
