[package]
name = "win-mmio-msr-cli"
version = "0.1.0"
edition = "2021"
description = "Windows Intel RAPL package power limit CLI with a fail-closed hardware bridge"
license = "MIT"
publish = false

[lib]
name = "win_mmio_msr_cli"
path = "src/lib.rs"

[[bin]]
name = "win-mmio-msr-cli"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
