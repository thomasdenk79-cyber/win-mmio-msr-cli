[package]
name = "rapl-watchdog"
version = "0.3.0"
edition = "2021"
description = "Opt-in Windows service that re-applies audited RAPL package limits within a correction budget"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
win-mmio-msr-cli = { path = ".." }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"